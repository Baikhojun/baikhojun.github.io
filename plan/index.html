<!DOCTYPE html>
<!-- 이 파일은 부부 일정표(은붕이·호붕이)의 화면이다. 데이터는 로그인한 두 사람만 볼 수 있다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://basbbsjruspkgxdjagoo.supabase.co; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>우리 부부 일정표</title>
  <meta name="theme-color" content="#f6ece8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="우리 일정">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="seasons.css">
  <link rel="stylesheet" href="app.css?v=20261023-mid-calendar">
</head>
<body>
  <div class="season-fx" aria-hidden="true"></div>

  <!-- 로그인 -->
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <span class="motif" aria-hidden="true"></span>
      <h1>은붕이 <span class="heart">♥</span> 호붕이</h1>
      <p>우리 둘만의 일정표</p>
      <div class="who-pick" role="group" aria-label="누구인가요">
        <button type="button" data-person="eun">🐰 은붕이</button>
        <button type="button" data-person="ho">🐻 호붕이</button>
      </div>
      <input id="login-user" class="sr-only" type="email" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>
      <input id="login-pw" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
      <button id="login-go" class="go" type="submit">들어가기</button>
      <p id="login-err" class="err" role="alert"></p>
      <small>한 번 들어오면 이 기기에서는 다음부터 자동으로 열린다.</small>
    </form>
  </div>

  <!-- 본 화면 -->
  <div id="app" class="app hidden">
    <header class="top">
      <div class="top-row">
        <div class="brand">은붕이 <span class="heart">♥</span> 호붕이 <span class="motif" aria-hidden="true"></span></div>
        <button id="me" class="me-chip" type="button" aria-haspopup="true" aria-label="내 계정 메뉴"></button>
      </div>
      <div class="month-row">
        <button id="prev" class="nav-btn" type="button" aria-label="이전 달">‹</button>
        <h1><span id="m-title"></span><small class="season-label"></small></h1>
        <button id="next" class="nav-btn" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="tool-row">
        <button id="today-btn" class="pill" type="button">오늘</button>
        <button id="shift-btn" class="pill" type="button">교대</button>
      </div>
    </header>

    <div id="menu" class="menu hidden" role="menu">
      <div class="info">이 기기에 로그인되어 있다</div>
      <button id="refresh" type="button" role="menuitem">새로 불러오기</button>
      <button id="logout" type="button" role="menuitem">로그아웃</button>
    </div>

    <div class="layout">
      <section id="cal" class="cal" aria-label="달력">
        <div class="wk" aria-hidden="true"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
        <div id="grid" class="grid"></div>
        <div class="legend">
          <span><b style="--c:var(--shift-D)">D</b>데이</span>
          <span><b style="--c:var(--shift-E)">E</b>이브닝</span>
          <span><b style="--c:var(--shift-N)">N</b>나이트</span>
          <span><b style="--c:var(--shift-OF)">OF</b>오프</span>
          <span><i style="--c:var(--p-eun)"></i>은붕이</span>
          <span><i style="--c:var(--p-ho)"></i>호붕이</span>
          <span><i style="--c:var(--p-both)"></i>함께</span>
        </div>
      </section>
      <section id="day" class="day" aria-live="polite"></section>
    </div>
  </div>

  <!-- 교대 입력 -->
  <div id="shift-bar" class="shift-bar hidden" role="toolbar" aria-label="은붕이 교대 입력">
    <div class="inner">
      <div class="hint">🐰 은붕이 근무를 고르고 달력의 날짜를 누른다</div>
      <div class="brushes">
        <button type="button" class="brush" data-code="D" style="--c:var(--shift-D)">D</button>
        <button type="button" class="brush" data-code="E" style="--c:var(--shift-E)">E</button>
        <button type="button" class="brush" data-code="N" style="--c:var(--shift-N)">N</button>
        <button type="button" class="brush" data-code="OF" style="--c:var(--shift-OF)">OF</button>
        <button type="button" class="brush erase" data-code="X">지우기</button>
        <button type="button" class="brush done" id="shift-done">완료</button>
      </div>
      <div class="seq">
        <input id="seq-input" type="text" inputmode="text" autocapitalize="characters" placeholder="한 번에: D D E E N N OF OF" aria-label="선택한 날부터 연속 입력">
        <button id="seq-apply" type="button">선택한 날부터 입력</button>
      </div>
    </div>
  </div>

  <!-- 일정 입력 시트 -->
  <div id="overlay" class="overlay hidden"><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="일정 입력"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="vendor/supabase-js-2.117.2.min.js"></script>
  <script src="config.js"></script>
  <script src="holidays.js"></script>
  <script src="app.js?v=20261023-mid-calendar"></script>
</body>
</html>
