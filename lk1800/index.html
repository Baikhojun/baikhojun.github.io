function qty(m){return m.d.reduce(function(a,b){return a+b},0)}
function mat(m){return m.d[0]+m.d[1]+m.d[2]}
function perMat(m){return m.p/mat(m)}
function perQ(m){return m.p/qty(m)}
function perCoil(m){return m.p/m.coil}
function perCm(m){return m.p/m.th}
function perYr(m){return m.wy?m.p/m.wy:null}
/* 표시되는 항목 점수(소수 1자리)의 합을 총점으로 쓰므로, 기준값도 같은 데이터에서 산출 */
var BEST = Math.min.apply(null, M.map(perQ));
function brandAvg(b){
  var g=M.filter(function(m){return m.b===b});
  return g.reduce(function(a,m){return a+perQ(m)},0)/g.length;
}
var AVG_BL = brandAvg('BL'), AVG_BS = brandAvg('BS');

function won(n){return Math.round(n).toLocaleString('ko-KR')}
function man(n){return (n/10000).toFixed(1)+'만'}
function f1(n){return n.toFixed(1)}
function bc(m){return m.b==='BL'?'var(--bl)':'var(--bs)'}

  /* 점수·가격차는 모델 데이터에서 직접 산출해 다른 탭과 어긋나지 않게 함
     {gp}=품질 격차, {pd}=가격차(만원), {nv}=검증 제외 점수 대비 */
  var MT=[
    {a:"New Z7",c:"이켈로스 T1000",
     v:"가격차가 {pd}인데 품질은 {gp}점 벌어집니다. 이 구간은 비교 자체가 성립하지 않아요. Z7은 일체형이라 토퍼 교체가 불가능하고 천연소재도 없는데, T1000은 분리형 토퍼 2매에 말총·알파카울, 보증 20년입니다."},
    {a:"Z5",c:"판타소스 T570",
     v:"T570이 {pd} 더 싸면서 {gp}점 앞섭니다. Z5가 이기는 건 순수 미디엄 경도(에덴)와 LIFEEDGE뿐이고, 보증 연수가 확인되지 않는 게 결정적 감점입니다."},
    {a:"Z5",c:"모피어스 T750",
     v:"T750이 {pd} 비싸지만 {gp}점 앞섭니다. 20만원 차이로 말총 다량·바나듐티타늄·보증 25년·리뷰 3,943건을 얻는 셈입니다."},
    {a:"Z8B",c:"오네이로스 T2500",
     v:"T2500이 {pd} 싸고 {gp}점 앞섭니다. 다만 T2500은 리뷰 1건·평점 3.0이라 검증 리스크가 큽니다. 검증 항목을 빼면 {nv}로 T2500이 크게 앞섭니다."},
    {a:"Z10B",c:"오네이로스 T2500",
     v:"Z10B가 {pd} 더 비싼데 {gp}점 뒤집니다. Z10B가 확실히 이기는 건 코일 5,172개와 보증 30년이지만, 천연소재가 양모 하나뿐이고 순수 미디엄 경도가 없습니다."}
  ];
  var h='<h2>④ 동가격대 1:1 매칭</h2>'
    +'<p class="lead">두 브랜드는 같은 대표(서진원)·같은 주소의 계열사이고 쇼룸도 공유합니다. 그래서 가격대가 겹치는 구간에서 어느 쪽을 집어야 하는지가 실질적인 질문입니다.</p>';
  MT.forEach(function(x){
    var A=find(x.a), C=find(x.c);
    var gp=qty(C)-qty(A), pd=Math.abs(C.p-A.p);
    var txt=x.v.replace('{gp}',f1(gp))
               .replace('{pd}',man(pd)+'원')
               .replace('{nv}',f1(qty(C)-C.d[4])+' 대 '+f1(qty(A)-A.d[4]));
    h+='<div class="mt"><div class="vs">'
      +'<div class="side"><div class="s1">'+A.n+'</div><div class="s2">'+man(A.p)+'원 · '+f1(qty(A))+'점</div></div>'
      +'<div class="mid2">VS</div>'
      +'<div class="side r"><div class="s1">'+C.n+'</div><div class="s2">'+man(C.p)+'원 · '+f1(qty(C))+'점</div></div>'
      +'</div><div class="gap">'+C.n+' 품질 +'+f1(gp)+'점</div>'
      +'<div class="txt">'+txt+'</div></div>';
  });
  h+='<p class="note">베스트슬립 쪽 가격은 Z5·Z8B·Z10B가 환산 추정치입니다. 환산가를 10% 낮춰도 순위와 결론은 바뀌지 않았습니다.</p>';
  document.getElementById('s-match').innerHTML=h;
})();

/* ── 6) 사양 원장 ─────────────────────────────────── */
(function(){
  var h='<h2>⑤ 전 모델 사양 원장</h2>'
    +'<p class="lead">LK1800 가격 낮은 순입니다. 모델명을 탭하면 전체 사양이 펼쳐집니다.</p>';
  M.slice().sort(function(a,b){return a.p-b.p}).forEach(function(m){
    h+='<details class="spec"><summary>'
      +'<span class="arw">▶</span>'
      +'<span class="sn">'+m.n+' '+bchip(m)+'</span>'
      +'<span class="sp" style="color:'+bc(m)+'">'+man(m.p)+'원'+(m.cf?'':'<span class="est">*</span>')+'</span></summary>'
      +'<div class="kv">'
      +'<div class="r"><div class="k">포지션</div><div class="v">'+(m.b==='BL'?'브랜드리스':'베스트슬립')+' · '+m.t+'</div></div>'
      +'<div class="r"><div class="k">가격</div><div class="v">'+won(m.p)+'원<br><span style="font-size:12px;color:var(--mute)">'+m.pn+'</span></div></div>'
      +'<div class="r"><div class="k">구조</div><div class="v">'+m.st+'</div></div>'
      +'<div class="r"><div class="k">코일</div><div class="v">'+m.cn+'</div></div>'
      +'<div class="r"><div class="k">스프링</div><div class="v">'+m.al+'</div></div>'
      +'<div class="r"><div class="k">천연소재</div><div class="v">'+m.na+'</div></div>'
      +'<div class="r"><div class="k">두께</div><div class="v">'+m.th+'cm</div></div>'
      +'<div class="r"><div class="k">보증</div><div class="v">'+m.wn+'</div></div>'
      +'<div class="r"><div class="k">경도</div><div class="v">'+m.fm+'</div></div>'
      +'<div class="r"><div class="k">평점</div><div class="v">'+m.rt+'</div></div>'
      +'<div class="r"><div class="k">종합</div><div class="v"><b>'+f1(qty(m))+' / 100점</b> · 품질 1점당 '+won(perQ(m))+'원</div></div>'
      +'</div></details>';
  });
  document.getElementById('s-spec').innerHTML=h;
})();

/* ── 7) 주의사항 ──────────────────────────────────── */
(function(){
  var CF=[
    ["오네이로스 T2500","스토어 349.2만 vs 상세페이지 337.2만 (12만원 차이)","어느 쪽이 실제 결제가이고 12만원 차이의 사유가 무엇인지"],
    ["판타소스 T570","보증 15년(본문) vs 20년(업그레이드 안내) · 합금 Ti-Si vs 바나듐티타늄","보증서에 찍히는 연수와 실제 탑재 합금 명칭"],
    ["뉴 녹턴 T450","리스팅 '미디엄' vs 스펙표 MS/MH 2경도 · 분리형 vs 일체형 유로탑","배송되는 제품의 경도와 토퍼 분리 여부"],
    ["Z5","리스팅 '일체형' vs 상세페이지 '분리형(토퍼 교체 가능)' · 보증 연수 미표기","토퍼 교체 가능 여부와 스프링 무상보증 연수"],
    ["New Z7","리뉴얼로 토퍼 분리 불가로 전환 · 배너는 VA·TI·NIUM, 배지는 Ti-Si","토퍼 교체가 정말 불가능한지, 실제 합금이 무엇인지"],
    ["Z8B · Z10B","LK1800 가격 미공개 · 코일 수가 상세페이지에 미기재","LK1800 견적가와 LK1800 기준 실제 코일 수"],
    ["이켈로스 T1000","보증 20년으로 하위 모델 T750(25년)보다 짧음","상위 모델의 보증이 더 짧은 이유 (오기 여부)"]
  ];
  var h='<h2>⑥ 주문 전 확인할 것</h2>'
    +'<div class="co d"><b>라지킹은 양 브랜드 모두 100일 체험·단순변심 반품·교환이 전부 불가</b>'
    +'<p>브랜드리스 스펙표 붉은 각주와 베스트슬립 공식 견적서가 동일하게 명시합니다. 베스트슬립 견적서는 100일 체험 대상을 "모피어스21·녹턴19·리차지17·Q3000의 S·SS·D·Q·K 상단 매트리스만"으로 못 박고 라지킹을 명시적으로 제외합니다. 되돌릴 방법이 없으니 쇼룸 체험이 사실상 필수입니다.</p></div>'
    +'<div class="co w"><b>라지킹은 2분할 제작이 기본 — 일체형은 추가금</b>'
    +'<p>베스트슬립 공식 견적서 기준 가로 1,700mm 이상 유로탑·필로우탑은 2개로 분리 제작되며, 일체형 주문 시 15만원 이상 추가금이 붙고 운반 책임이 구매자에게 넘어갑니다. 브랜드리스도 K 이상은 2분할이 기본입니다. LK1800은 승강기 17~19인승 이상이 필요하고, 미달 시 사다리차 비용(10만원 이상)이 별도입니다.</p></div>'
    +'<div class="co i"><b>가격 확정성 자체가 브랜드리스의 우위</b>'
    +'<p>브랜드리스는 LK1800 6종 전부 스토어 확정가가 노출됩니다. 베스트슬립은 New Z7만 LK1800 정규 리스팅이고 Z5·Z8B·Z10B·Z9·Z10·Z11은 주문제작 견적이라 이 리포트의 환산가가 실제 견적과 다를 수 있습니다. 정찰제라 협상 여지도 없으니, 쇼룸에서 LK1800 견적을 받아 여기 환산가와 대조해 보세요.</p></div>'
    +'<h2 style="margin-top:20px">표기 상충 — 판매자에게 직접 물을 것</h2>'
    +'<p class="lead">상세페이지 안에서 서로 어긋나는 항목입니다. 라지킹은 반품이 안 되므로 주문 전에 확인해야 합니다.</p>';
  CF.forEach(function(c){
    h+='<div class="card"><div style="font-size:14.5px;font-weight:800;letter-spacing:-.3px">'+c[0]+'</div>'
      +'<div style="font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6;word-break:keep-all">'+c[1]+'</div>'
      +'<div class="hr"></div>'
      +'<div style="font-size:13px;line-height:1.6;word-break:keep-all"><b style="color:var(--bl)">확인 질문 · </b>'+c[2]+'</div></div>';
  });
  h+='<h2 style="margin-top:20px">이 분석의 한계</h2>'
    +'<p class="lead">폼 밀도(kg/m³)는 두 브랜드 모두 전 모델 미공개이므로 내장재 점수는 레이어 종류와 천연소재 등급으로 대체 평가했습니다. 코일 수는 오네이로스 T2500·이켈로스 T1000이 미공개라 모피어스 T750의 확정치 2,410개로 보수 추정했는데, 상위 모델이므로 실제로는 더 많을 가능성이 높고 그만큼 두 모델에 불리하게 계산됐습니다. Z8B 3,325개·Z10B 5,172개는 상세페이지가 아닌 사전 조사 수치입니다.</p>'
    +'<p class="lead">Z9·Z10·Z11은 LK1800 가격을 확보하지 못해 비교에서 제외했습니다. 특히 <b>Z11</b>(듀얼 셀코일 coil-on-coil + 메리노울 + 말총패드, 3년 후 토퍼 무상교환)은 품질만 보면 상위 진입이 가능한 유일한 베스트슬립 모델이므로, 쇼룸에서 LK1800 견적을 받아볼 가치가 있습니다.</p>';
  document.getElementById('s-warn').innerHTML=h;
})();
</script>
