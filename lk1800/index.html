  var g=M.filter(function(m){return m.b===b});
  return g.reduce(function(a,m){return a+perQ(m)},0)/g.length;
}

/* ── 동률 구간 ──
   항목 점수가 0.1점 격자이고 실제 판단 오차는 축당 ±0.5점 수준이므로
   총점 오차는 약 ±1.2점(1.5~2%)입니다. 1점당 가격 차이가 4% 안이면
   순서를 주장할 수 없어 같은 군으로 묶습니다. */
var TIE_GAP = 0.04;
var TIE = (function(){
  var rk=M.slice().sort(function(a,b){return perQ(a)-perQ(b)});
  var band={}, g=1, prev=perQ(rk[0]);
  rk.forEach(function(m,i){
    if(i>0){ if((perQ(m)-prev)/prev>=TIE_GAP) g++; prev=perQ(m); }
    band[m.n]=g;
  });
  var size={};
  rk.forEach(function(m){size[band[m.n]]=(size[band[m.n]]||0)+1});
  return {g:band,size:size,rk:rk};
})();
function tieTag(m){
  var g=TIE.g[m.n];
  if(TIE.size[g]<2) return '';
  return '<span class="tie'+(g===1?' t1':'')+'">동률 '+g+'군</span>';
}
